{% extends "base.html" %}

{% block title %}fathom - {{ symbol }} Analysis{% endblock %}

{% block content %}
<div class="stock-header">
    <div class="stock-title">
        <h1>{{ symbol }}</h1>
        <p>{{ name }}</p>
        <p class="stock-meta">{{ sector }} · {{ country }} · {{ exchange }}</p>
    </div>
    <div class="current-price" id="priceDisplay">
        <div class="price-label">Loading price...</div>
        <div class="price-value">---</div>
    </div>
</div>

{% if chart %}
<div class="metric-card chart-card">
    <div class="metric-title">📉 Price History</div>
    <svg class="price-chart" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c98a4b" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#c98a4b" stop-opacity="0.0"/>
            </linearGradient>
        </defs>
        <polygon points="{{ chart.area }}" fill="url(#areaGrad)"/>
        <polyline points="{{ chart.points }}" fill="none" stroke="#c98a4b"
                  stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="{{ chart.last_x }}" cy="{{ chart.last_y }}" r="4" fill="#c98a4b"/>
        <text x="16" y="18" fill="rgba(255,255,255,0.65)" font-size="12">High ${{ chart.high }}</text>
        <text x="{{ chart.low_x }}" y="{{ chart.low_y }}"
              fill="rgba(255,255,255,0.65)" font-size="12">Low ${{ chart.low }}</text>
        <text x="784" y="232" text-anchor="end" fill="rgba(255,255,255,0.4)" font-size="11">{{ chart.range }}</text>
    </svg>
</div>
{% endif %}

<div id="loading" class="loading">Loading analysis...</div>

<div id="metricsContainer" style="display: none;">
    <div class="metrics-grid" id="metricsGrid"></div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="refreshBtn" onclick="refresh()">🔄 Refresh Data</button>
        <a href="/" class="btn btn-secondary">← All Stocks</a>
    </div>
</div>

<script>
    const symbol = '{{ symbol }}';

    const fmt = (v, suffix = '') => `${v}${suffix}`;
    const sign = (v) => v === 0 || v == null || isNaN(v) ? 'N/A' :
        `${v > 0 ? '+' : ''}${v}${'%'}`;
    const cls = (v) => v > 0 ? 'positive' : (v < 0 ? 'negative' : '');
    const fmtMoney = (v) => {
        if (v == null || isNaN(v)) return 'N/A';
        const a = Math.abs(v);
        if (a >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
        if (a >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
        if (a >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
        if (a >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
        return '$' + v.toFixed(0);
    };
    const fmtNum = (v) => {
        if (v == null || isNaN(v)) return 'N/A';
        const a = Math.abs(v);
        if (a >= 1e9) return (v / 1e9).toFixed(2) + 'B';
        if (a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (a >= 1e3) return (v / 1e3).toFixed(1) + 'K';
        return String(v);
    };
    const val = (d, k) => (d && d[k] != null ? d[k] : null);
    const valText = (v, prec = 2) => (v != null ? v.toFixed(prec) : 'N/A');

    async function fetchData() {
        const loader = document.getElementById('loading');
        const container = document.getElementById('metricsContainer');
        const priceDisplay = document.getElementById('priceDisplay');

        loader.style.display = 'block';
        container.style.display = 'none';

        try {
            const res = await fetch(`/api/stocks/${symbol}/momentum`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            displayData(data);
            loader.style.display = 'none';
            container.style.display = 'block';
        } catch (err) {
            loader.innerHTML = `Error: ${err.message}`;
        }
    }

    function displayData(d) {
        document.getElementById('priceDisplay').innerHTML = `
            <div class="price-label">Current Price</div>
            <div class="price-value">$${d.current_price.toFixed(2)}</div>
        `;

        document.getElementById('metricsGrid').innerHTML = `
            <div class="metric-card">
                <div class="metric-title">Momentum</div>
                <div class="metric-row">
                    <span class="metric-label">6-Month:</span>
                    <span class="metric-value ${cls(d.momentum_6m)}">${sign(d.momentum_6m)}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">3-Month:</span>
                    <span class="metric-value ${cls(d.momentum_3m)}">${sign(d.momentum_3m)}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">1-Month:</span>
                    <span class="metric-value ${cls(d.momentum_1m)}">${sign(d.momentum_1m)}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Trend Strength:</span>
                    <span class="metric-value">${d.trend_strength}%</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Price Levels</div>
                <div class="metric-row">
                    <span class="metric-label">Current:</span>
                    <span class="metric-value">$${d.current_price.toFixed(2)}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">~6 Months Ago:</span>
                    <span class="metric-value">$${d.price_6mo_ago.toFixed(2)}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">SMA 20:</span>
                    <span class="metric-value">${d.sma_20 ? '$' + d.sma_20.toFixed(2) : 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">SMA 50:</span>
                    <span class="metric-value">${d.sma_50 ? '$' + d.sma_50.toFixed(2) : 'N/A'}</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Valuation</div>
                <div class="metric-row">
                    <span class="metric-label">P/E Ratio:</span>
                    <span class="metric-value">${d.valuation && d.valuation.pe != null ? d.valuation.pe.toFixed(2) : 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">P/B Ratio:</span>
                    <span class="metric-value">${d.valuation && d.valuation.pb != null ? d.valuation.pb.toFixed(2) : 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">P/S Ratio:</span>
                    <span class="metric-value">${d.valuation && d.valuation.ps != null ? d.valuation.ps.toFixed(2) : 'N/A'}</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Snapshot</div>
                <div class="metric-row">
                    <span class="metric-label">Market Cap:</span>
                    <span class="metric-value">${fmtMoney(val(d.snapshot, 'market_cap'))}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">52-Week Range:</span>
                    <span class="metric-value">${val(d.snapshot, 'week52_low') != null && val(d.snapshot, 'week52_high') != null ? `$${valText(val(d.snapshot, 'week52_low'))} – $${valText(val(d.snapshot, 'week52_high'))}` : 'N/A'}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Volume:</span>
                    <span class="metric-value">${fmtNum(val(d.snapshot, 'volume'))}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Avg Volume:</span>
                    <span class="metric-value">${fmtNum(val(d.snapshot, 'avg_volume'))}</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Last Close Date:</span>
                    <span class="metric-value">${d.last_date || 'N/A'}</span>
                </div>
            </div>
        `;
    }

    async function refresh() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.textContent = 'Refreshing…';
        try {
            await fetch(`/api/fetch/${symbol}`);
        } catch (e) {
            // best effort; momentum call below will surface errors
        }
        btn.disabled = false;
        btn.textContent = '🔄 Refresh Data';
        fetchData();
    }

    fetchData();
</script>
{% endblock %}
